# Goblin Cellar — homelab SANS cloner le dépôt
#
#   mkdir -p goblin-cellar && cd goblin-cellar
#   # copier ce fichier ici (ou curl, voir le README)
#   docker compose up -d
#
# L'image est sur GHCR. Rien d'autre à builder.
# Package privé ?  docker login ghcr.io

name: goblin-cellar

services:
  goblin-cellar:
    image: ${GOBLIN_CELLAR_IMAGE:-ghcr.io/lordd9/gobelin_cellar:latest}
    container_name: goblin-cellar
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "${GOBLIN_CELLAR_PORT:-8080}:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /data/cave.sqlite
      PUBLIC_DIR: /app/public
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    # --- Reverse proxy (décommente si tu utilises Traefik) -----------------
